/* 圖片展示區塊與滑鼠動態效果 */
.image-gallery {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.image-item {
    display: inline-block;
    overflow: hidden;
    border-radius: 8px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* 滑鼠滑過去時產生的動態效果（放大並加上陰影） */
.image-item:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
}

.image-item img {
    width: 200px;  /* 可自行調整圖片顯示寬度 */
    height: 150px; /* 可自行調整圖片顯示高度 */
    object-fit: cover;

    <h1>歡迎來到我的網站</h1>

    <h2>
        <a href="https://www.nuu.edu.tw/">關於我</a>

    <h3>
        <p>這是一個簡單的HTML範例，展示了基本的網頁結構與外部CSS。</p>

    <!-- 五個圖片展示區塊 -->
    <h2>圖片藝廊（滑鼠懸停有動態效果，點擊可開啟新網頁）</h2>
    <div class="image-gallery">

        <!-- 圖片 1 -->
        <a href="https://www.nuu.edu.tw/" target="_blank" class="image-item">
            <img src="0.jpg" alt="圖片 1">
        </a>
